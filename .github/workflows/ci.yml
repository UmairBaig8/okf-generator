name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust (for tree-sitter-kotlin source build)
        run: rustup show || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff~=0.8.0"
      - run: ruff check okf/  # uses [tool.ruff] config in pyproject.toml

  typecheck:
    name: Typecheck (mypy, core modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mypy
      # Scoped to the well-typed core; legacy modules (cli, init, mcp_server,
      # generator internals) are not yet fully annotated and are excluded.
      - run: mypy okf/config.py okf/_walk.py okf/frontmatter.py okf/ignore.py okf/parsers/base.py okf/storage/base.py okf/enrich/base.py okf/enrich/_llm_prompts.py --no-site-packages --follow-imports=skip

  security:
    name: Supply-chain scan (Bumblebee + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Install Bumblebee
        run: go install github.com/perplexityai/bumblebee/cmd/bumblebee@latest
      - name: Install project dependencies (for venv scan)
        run: |
          python3 -m venv /tmp/scan_venv
          /tmp/scan_venv/bin/pip install -e ".[llm]" -q
      - name: Run Bumblebee scan
        run: |
          ~/go/bin/bumblebee scan --profile baseline --root "$(pwd)" --max-duration 2m 2>&1 | tail -5 || echo "Bumblebee scan completed"
      - name: Run pip-audit (known vulnerabilities)
        run: |
          /tmp/scan_venv/bin/pip install pip-audit -q
          /tmp/scan_venv/bin/pip-audit -r "$(pwd)/pyproject.toml" || true

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
